name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pastel snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ec8fa5&color_dots=#fdf2f5,#ffd1dc,#ffb6c1,#f59ab3,#ec8fa5
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb6c1&color_dots=#2d2433,#5c3a4a,#9c5470,#d9708c,#ffb6c1

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
