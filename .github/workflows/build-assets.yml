name: Build pixel assets (header & about)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/photo.jpg"
      - "tools/photo.jpeg"
      - "tools/photo.png"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools numpy pillow
      - name: Generate header.svg and about.svg
        run: |
          python tools/make_header.py
          python tools/make_rest.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: rebuild pixel assets with photo" && git push)
